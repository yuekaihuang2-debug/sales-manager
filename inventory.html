<script src="js/cloud.js"></script>
<script src="js/db.js"></script>
<script>
// ===== 鐘舵€佸彉閲?=====
let currentStoreId = null;
let editingProductId = null;
let editingShipmentId = null;
let editingBoxId = null;
let boxProductsTemp = [];
let editingStoreId = null;

// ===== 鍒濆鍖?=====
document.addEventListener("DOMContentLoaded", async () => {
  await loadStores();
  document.getElementById("shipDate").value = todayStr();
  const stored = localStorage.getItem("lastStoreId");
  if (stored) { currentStoreId = parseInt(stored); }
  if (!currentStoreId) {
    const stores = await dbGetAll("stores");
    if (stores.length > 0) currentStoreId = stores[0].id;
  }
  await switchStore();
});

// ===== 搴楅摵绠＄悊 =====
async function loadStores() {
  const stores = await dbGetAll("stores");
  const sel = document.getElementById("storeSelect");
  sel.innerHTML = stores.map(s => `<option value="${s.id}">${s.name}</option>`).join("");
  if (stores.length === 0) {
    sel.innerHTML = "<option value=\"\">-- 璇峰厛鍒涘缓搴楅摵 --</option>";
  }
}

async function switchStore() {
  const sel = document.getElementById("storeSelect");
  currentStoreId = parseInt(sel.value);
  if (!currentStoreId) return;
  localStorage.setItem("lastStoreId", currentStoreId);
  await Promise.all([renderProducts(), renderShipments(), renderStockTable()]);
}

function showAddStore() {
  editingStoreId = null;
  document.getElementById("storeModalTitle").textContent = "鏂板缓搴楅摵";
  document.getElementById("storeNameInput").value = "";
  openModal("storeModal");
}

function showEditStore() {
  if (!currentStoreId) return alert("璇峰厛閫夋嫨搴楅摵");
  editingStoreId = currentStoreId;
  document.getElementById("storeModalTitle").textContent = "閲嶅懡鍚嶅簵閾?;
  const sel = document.getElementById("storeSelect");
  document.getElementById("storeNameInput").value = sel.options[sel.selectedIndex].text;
  openModal("storeModal");
}

async function saveStore() {
  const name = document.getElementById("storeNameInput").value.trim();
  if (!name) return alert("璇疯緭鍏ュ簵閾哄悕绉?);
  if (editingStoreId) {
    const store = await dbGet("stores", editingStoreId);
    store.name = name;
    await dbPut("stores", store);
  } else {
    await dbAdd("stores", { name });
  }
  closeModal("storeModal");
  await loadStores();
  document.getElementById("storeSelect").value = currentStoreId || "";
}

// ===== 浜у搧绠＄悊 =====
async function renderProducts() {
  const tbody = document.getElementById("productTable");
  if (!currentStoreId) { tbody.innerHTML = "<tr><td colspan=\"9\" class=\"empty-state\">璇峰厛閫夋嫨搴楅摵</td></tr>"; return; }
  const products = await getStoreProducts(currentStoreId);
  if (products.length === 0) {
    tbody.innerHTML = "<tr><td colspan=\"9\"><div class=\"empty-state\"><div class=\"icon\">馃摝</div>鏆傛棤浜у搧锛岀偣鍑绘坊鍔犱骇鍝佸紑濮?/div></td></tr>";
    return;
  }
  tbody.innerHTML = products.map(p => `
    <tr>
      <td>${p.image ? `<img src="${escHtml(p.image)}" class="prod-img" onclick="showProductImage(\`${escHtml(p.image)}\`)" style="cursor:pointer;">` : "-"}</td>
      <td>${escHtml(p.productId||"")}</td>
      <td>${escHtml(p.sku||"")}</td>
      <td>${escHtml(p.name||"")}</td>
      <td>${p.cost ? "楼"+p.cost : "-"}</td>
      <td>${p.headCost ? "楼"+p.headCost : "-"}</td>
      <td>${p.appointmentType||"-"}</td>
      <td>${p.appointmentDate||"-"}</td>
      <td><button class="btn btn-outline btn-sm" onclick="editProduct(${p.id})">鉁忥笍</button> <button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.id})">馃棏</button></td>
    </tr>
  `).join("");
}function previewProductImage() {
  const input = document.getElementById("prodImageInput");
  const preview = document.getElementById("prodImagePreview");
  const img = document.getElementById("prodImagePreviewImg");
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = function(e) {
      img.src = e.target.result;
      preview.style.display = "block";
    };
    reader.readAsDataURL(input.files[0]);
  } else {
    preview.style.display = "none";
    img.src = "";
  }
}

function showProductImage(src) {
  const w = window.open("", "_blank", "width=600,height=600");
  if (w) {
    w.document.write("<img src=\"" + escHtml(src) + "\" style=\"max-width:100%;height:auto;\">");
  }
}
function showAddProduct() {
  if (!currentStoreId) return alert("璇峰厛閫夋嫨搴楅摵");
  editingProductId = null;
  document.getElementById("productModalTitle").textContent = "娣诲姞浜у搧";
  "prodProductId prodSku prodName prodCost prodHeadCost prodApptType prodApptDate".split(" ").forEach(id => document.getElementById(id).value = "");
  openModal("productModal");
}

async function editProduct(id) {
  const p = await dbGet("products", id);
  if (!p) return;
  editingProductId = id;
  document.getElementById("productModalTitle").textContent = "缂栬緫浜у搧";
  document.getElementById("prodProductId").value = p.productId || "";
  document.getElementById("prodSku").value = p.sku || "";
  document.getElementById("prodName").value = p.name || "";
  document.getElementById("prodCost").value = p.cost || "";
  document.getElementById("prodHeadCost").value = p.headCost || "";
  document.getElementById("prodApptType").value = p.appointmentType || "";
  document.getElementById("prodApptDate").value = p.appointmentDate || "";
  document.getElementById("prodEnglishName").value = p.englishName || "";
  document.getElementById("prodMaterial").value = p.material || "";
  document.getElementById("prodImageInput").value = "";
  const preview = document.getElementById("prodImagePreview");
  const img = document.getElementById("prodImagePreviewImg");
  if (p.image) {
    img.src = p.image;
    preview.style.display = "block";
  } else {
    preview.style.display = "none";
    img.src = "";
  }
  openModal("productModal");
}async function saveProduct() {
  const productId = document.getElementById("prodProductId").value.trim();
  const sku = document.getElementById("prodSku").value.trim();
  const name = document.getElementById("prodName").value.trim();
  if (!productId || !sku || !name) return alert("浜у搧ID銆丼KU銆佷骇鍝佸悕绉板潎涓哄繀濉?);
  const data = {
    storeId: currentStoreId, productId, sku, name,
    cost: parseFloat(document.getElementById("prodCost").value) || 0,
    headCost: parseFloat(document.getElementById("prodHeadCost").value) || 0,
    appointmentType: document.getElementById("prodApptType").value,
    appointmentDate: document.getElementById("prodApptDate").value,

async function renderShipments() {

async function renderShipmentCard(s, boxes) {
  let totalCbm = 0, totalWeight = 0, totalCbm1 = 0;
  for (const b of boxes) {
    totalCbm += (b.cbmPerBox || 0) * (b.boxCount || 1);
    totalWeight += (b.weight || 0) * (b.boxCount || 1);
    // 璁＄畻鍚勮竟+1鐨勬€绘柟鏁?
    let cbm1 = 0;
    if (b.spec) {
      const parts = b.spec.split(/[xX脳\*]/).map(x => parseFloat(x.trim()) || 0);
      if (parts.length === 3) {
        cbm1 = (parts[0]+1) * (parts[1]+1) * (parts[2]+1) / 1000000;
      }
    }
    totalCbm1 += cbm1 * (b.boxCount || 1);
  }
  let allProducts = [];
  let boxProdNames = {};
  for (const b of boxes) {
    const bpList = await getBoxProducts(b.id);
    const pnames = [];
    for (const bp of bpList) {
      const p = await dbGet("products", bp.productId);
      if (p) {
        allProducts.push({ ...p, qty: bp.quantity });
        pnames.push(p.name);
      }
    }
    boxProdNames[b.id] = pnames.join(", ");
  }
  const prodMap = {};
  for (const ap of allProducts) {
    const key = ap.productId;
    if (!prodMap[key]) prodMap[key] = { name: ap.name, sku: ap.sku, totalQty: 0 };
    prodMap[key].totalQty += ap.qty;
  }
  const prodSummary = Object.values(prodMap).map(pm => `${pm.name}(${pm.sku})x${pm.totalQty}`).join(", ") || "鏃?;
  return `<div class="card" id="shipment-${s.id}" style="margin-bottom:12px;border:1px solid #e0e0e0;">
    <div class="card-header" style="background:#fafafa;">
      <span>馃摝 鍑鸿揣鍗?#${s.id} 鈥?${s.date}</span>
      <span style="font-size:12px;color:#999;">${s.notes||""}</span>
      <button class="btn btn-success btn-sm" onclick="exportShipmentExcel(${s.id})" style="margin-left:auto;">馃摜 瀵煎嚭Excel</button> <button class="btn btn-danger btn-sm" onclick="deleteShipment(${s.id})">鍒犻櫎</button>
    </div>
    <div class="card-body">
      <div class="summary-bar">
        <span class="item"><span class="label">鎬荤鏁?</span> <span class="value">${boxes.length}</span></span>
        <span class="item"><span class="label">鎬绘柟鏁?</span> <span class="value">${totalCbm.toFixed(3)} CBM</span></span>
        <span class="item"><span class="label">瀹為檯鏂规暟(+1cm):</span> <span class="value">${totalCbm1.toFixed(3)} CBM</span></span>
        <span class="item"><span class="label">鎬婚噸閲?</span> <span class="value">${totalWeight.toFixed(1)} kg</span></span>
      </div>
      <div class="table-wrap" style="margin-bottom:8px;">
        <table style="font-size:12px;"><thead><tr><th>绠卞彿</th><th>浜у搧鍚嶅瓧</th><th>绠辨暟</th><th>瑁呯鏁?/th><th>绠辫</th><th>鍗曠鏂规暟</th><th>鎬绘柟鏁?/th><th>鎬婚噸閲?/th><th>绠遍害</th><th>鐘舵€?/th><th>鐗╂祦鍏徃</th><th>鎿嶄綔</th></tr></thead>
        <tbody>${boxes.map(b => renderBoxRow(b, boxProdNames[b.id] || "")).join("")}</tbody></table>
      </div>
      <div style="font-size:12px;color:#666;"><strong>浜у搧姹囨€?</strong> ${prodSummary}</div>
      <button class="btn btn-primary btn-sm" onclick="showAddBox(${s.id})" style="margin-top:8px;">+ 娣诲姞绠卞瓙</button>
    </div></div>`;
}

  const lbl = b.status === "logistics" ? "鐗╂祦涓? : b.status === "arrived" ? "宸插埌浠? : "Full璋冩嫧";

function calcBoxCbm() {
  const spec = document.getElementById("boxSpec").value.trim();
  const weight = parseFloat(document.getElementById("boxWeight").value) || 0;
  const boxCount = parseInt(document.getElementById("boxCount").value) || 1;
  let cbm = 0;
  if (spec) {
    const parts = spec.split(/[xX脳\*]/).map(s => parseFloat(s.trim()) || 0);
    if (parts.length === 3) cbm = parts[0] * parts[1] * parts[2] / 1000000;
  }
  document.getElementById("boxCbm").value = cbm.toFixed(4);
  document.getElementById("boxTotalCbm").value = (cbm * boxCount).toFixed(4);
  document.getElementById("boxTotalWeight").value = (weight * boxCount).toFixed(1);
}

async function renderStockTable() {
  const tbody = document.getElementById("stockTable").querySelector("tbody");
  if (!currentStoreId) { tbody.innerHTML = ""; return; }
  const filter = document.getElementById("stockStatusFilter").value;
  const products = await getStoreProducts(currentStoreId);
  let rows = [];
  for (const p of products) {
    let totalQty = 0;
    const boxProducts = await dbGetByIndex("box_products", "productId", p.id);
    for (const bp of boxProducts) {
      const box = await dbGet("boxes", bp.boxId);
      if (!box) continue;
      if (filter !== "all" && box.status !== filter) continue;
      if (box.status === "full") continue;
      totalQty += (box.boxCount || 1) * (box.packingCount || 1);
    }
    const totalCost = totalQty * (p.cost + (p.headCost || 0));
    rows.push({ p, totalQty, totalCost });
  }
  if (rows.length === 0) {
    tbody.innerHTML = "<tr><td colspan=\"6\"><div class=\"empty-state\">鏃犳暟鎹?/div></td></tr>";
  } else {
    tbody.innerHTML = rows.map(r => `<tr>
      <td>${escHtml(r.p.productId||"")}</td>
      <td>${escHtml(r.p.sku||"")}</td>
      <td>${escHtml(r.p.name||"")}</td>

      <td><button class="btn btn-outline btn-sm" onclick="showProductDetail(${r.p.id})">馃搳 璇︽儏</button></td>
    </tr>`).join("");
  }
}

async function showProductDetail(productId) {
  const p = await dbGet("products", productId);
  if (!p) return;
  document.getElementById("stockDetailTitle").textContent = `${p.name} (${p.sku}) 鈥?搴撳瓨璇︽儏`;

  let total = 0;
  for (const bp of boxProducts) {
    const box = await dbGet("boxes", bp.boxId);
    if (!box) continue;
    const shipment = await dbGet("shipments", box.shipmentId);
    const qty = (box.boxCount || 1) * (box.packingCount || 1);
    if (box.status !== "full") total += qty;
    const scls = box.status === "logistics" ? "tag-logistics" : box.status === "arrived" ? "tag-arrived" : "tag-full";
    const slbl = box.status === "logistics" ? "鐗╂祦涓? : box.status === "arrived" ? "宸插埌浠? : "Full璋冩嫧";
    html += `<tr><td>#${box.shipmentId}</td><td>${escHtml(box.boxNumber||"")}</td><td>${qty}</td><td><span class="tag ${scls}">${slbl}</span></td><td>${escHtml(box.logisticsCompany||"")}</td><td>${shipment ? shipment.date : ""}</td></tr>`;
  }
  html += "</tbody></table>";
  html += `<div class="summary-bar" style="margin-top:8px;"><span class="item"><span class="label">鎬诲簱瀛?</span> <span class="value">${total}</span></span></div>`;
  // 鏈€杩戦攢閲?
  const recent7 = await getRecentSales(productId, 7);
  const recent30 = await getRecentSales(productId, 30);
  const sum7 = recent7.reduce((a,b) => a + b.quantity, 0);
  const sum30 = recent30.reduce((a,b) => a + b.quantity, 0);
  html += `<div class="summary-bar" style="margin-top:4px;"><span class="item"><span class="label">杩?澶╅攢閲?</span> <span class="value">${sum7}</span></span><span class="item"><span class="label">杩?0澶╅攢閲?</span> <span class="value">${sum30}</span></span></div>`;
  // 澶囪揣鎻愰啋
  if (sum30 > 0 && total > 0) {
    const dailyAvg = sum30 / 30;
    const daysToEmpty = Math.floor(total / dailyAvg);
    if (daysToEmpty < 30) html += `<div class="alert alert-warning">鈿狅笍 褰撳墠搴撳瓨鍙淮鎸佺害 ${daysToEmpty} 澶╋紙鏃ュ潎閿€閲?${dailyAvg.toFixed(1)}锛夛紝寤鸿澶囪揣</div>`;
  }
  document.getElementById("stockDetailBody").innerHTML = html;
  openModal("stockDetailModal");
}

      const p = await dbGet("products", bp.productId);

    }
    return names;
  }
  for (const s of shipments) {
    const boxes = await getShipmentBoxes(s.id);
    for (const b of boxes) {
      if ((b.boxNumber && b.boxNumber.toLowerCase().includes(term.toLowerCase())) || (b.currentLabel && b.currentLabel.toLowerCase().includes(term.toLowerCase()))) {
        const productNames = await getBoxProductNames(b.id);
        const labels1 = await dbGetByIndex("box_labels", "boxId", b.id);
        const labelHistory1 = labels1.sort((a,c) => (a.timestamp||"").localeCompare(c.timestamp||"")).map(l => l.label);
        results.push({ shipment: s, box: b, productNames: productNames, labelHistory: labelHistory1 });
      }
    }
  }
  if (results.length === 0) {
    const allLabels = await dbGetAll("box_labels");
    const matchingLabelIds = allLabels.filter(l => l.label && l.label.toLowerCase().includes(term.toLowerCase())).map(l => l.boxId);
    if (matchingLabelIds.length > 0) {
      for (const s of shipments) {
        const boxes = await getShipmentBoxes(s.id);
        for (const b of boxes) {
          if (matchingLabelIds.includes(b.id)) {
            const productNames = await getBoxProductNames(b.id);
            const labels2 = await dbGetByIndex("box_labels", "boxId", b.id);
            const labelHistory2 = labels2.sort((a,c) => (a.timestamp||"").localeCompare(c.timestamp||"")).map(l => l.label);
            results.push({ shipment: s, box: b, productNames: productNames, labelHistory: labelHistory2 });
          }
        }
      }
    }
  }
    // 閫氳繃 SKU / 浜у搧鍚嶇О鏌ユ壘
  if (currentStoreId) {
    const allProds = await getStoreProducts(currentStoreId);
    const matchedProducts = allProds.filter(p =>
      (p.sku && p.sku.toLowerCase().includes(term.toLowerCase())) ||
      (p.name && p.name.toLowerCase().includes(term.toLowerCase()))
    );
    for (const mp of matchedProducts) {
      const bpList = await getBoxProducts(mp.id);
      for (const bp of bpList) {
        const box = await dbGet("boxes", bp.boxId);
        if (!box) continue;
        // 妫€鏌ユ槸鍚﹀凡鍦ㄧ粨鏋滀腑锛堝幓閲嶏級
        if (results.some(r => r.box.id === box.id)) continue;
        const shipment = await dbGet("shipments", box.shipmentId);
        if (!shipment || shipment.storeId !== currentStoreId) continue;
        const productNames = [mp.name];
        const labels = await dbGetByIndex("box_labels", "boxId", box.id);
        const labelHistory = labels.sort((a,c) => (a.timestamp||"").localeCompare(c.timestamp||"")).map(l => l.label);
        results.push({ shipment, box, productNames, labelHistory });
      }
    }
  }
if (results.length === 0) {
    alert("鏈壘鍒板寘鍚鍙枫€? + term + "銆嶇殑绠卞瓙");
    return;
  }
  window._searchResults = results;
  document.getElementById("searchResultTitle").textContent = "鎵惧埌 " + results.length + " 涓尮閰嶇粨鏋?;
  var rhtml = "<table style=\"width:100%;font-size:12px;\"><thead><tr>" +
    "<th>浜у搧</th><th>绠卞彿</th><th>浜у搧鍚嶅瓧</th><th>绠卞敍</th><th>绠辨暟</th><th>瑁呯鏁?/th><th>鎬绘暟</th><th>鎿嶄綔</th>" +
    "</tr></thead><tbody>";
  for (var ri = 0; ri < results.length; ri++) {
    var r = results[ri];
    var totalQty = (r.box.boxCount||1) * (r.box.packingCount||1);
    rhtml += "<tr>" +
      "<td>" + escHtml(r.productNames.join(", ")) + "</td>" +
      "<td><strong>" + escHtml(r.box.boxNumber||"") + "</strong></td>" + "<td>" + escHtml(r.productNames.join(", ")) + "</td>" +
      "<td><a href=\"#\" onclick=\"closeModal(&quot;searchResultModal&quot;);showLabelHistory(" + r.box.id + ");return false;\">" + escHtml(r.box.currentLabel||"") + "</a>" + (r.labelHistory && r.labelHistory.length > 0 ? "<br><span style=\"font-size:11px;color:#999;\">" + escHtml(r.labelHistory.filter(function(l){return l !== r.box.currentLabel}).join(" 鈫?")) + "</span>" : "") + "</td>" +
      "<td>" + (r.box.boxCount||1) + "</td>" +
      "<td>" + (r.box.packingCount||1) + "</td>" +
      "<td>" + totalQty + "</td>" +
      "<td><button class=\"btn btn-outline btn-sm\" onclick=\"showSearchDetail(" + ri + ")\">璇︽儏</button></td>" +
      "</tr>";
  }
  rhtml += "</tbody></table>";
  rhtml += "<div id=\"searchDetailArea\" style=\"margin-top:12px;padding:12px;background:#f8f9fa;border-radius:6px;display:none;\"></div>";
  document.getElementById("searchResultBody").innerHTML = rhtml;
  openModal("searchResultModal");
  if (results.length > 0) {
    setTimeout(() => {
      const shipmentEls = document.querySelectorAll('[id^="shipment-"]');
      for (const el of shipmentEls) {
        if (el.id === "shipment-" + results[0].shipment.id) {
          el.scrollIntoView({ behavior: "smooth", block: "center" });
          el.style.background = "#fff9c4";
          setTimeout(() => el.style.background = "", 3000);
          break;
        }
      }
    }, 100);
  }
}

async function exportShipmentExcel(shipmentId) {
  if (typeof ExcelJS === "undefined") { alert("ExcelJS搴撴湭鍔犺浇锛岃妫€鏌ョ綉缁滆繛鎺ュ悗鍒锋柊椤甸潰"); return; }
  if (typeof TEMPLATE_BASE64 === "undefined") { alert("妯℃澘鏂囦欢鏈姞杞?); return; }
  const shipment = await dbGet("shipments", shipmentId);
  if (!shipment) return alert("鍑鸿揣鍗曚笉瀛樺湪");
  const boxes = await getShipmentBoxes(shipmentId);
  if (boxes.length === 0) return alert("璇ュ嚭璐у崟娌℃湁绠卞瓙");

  // 鍔犺浇妯℃澘锛堢涓€琛屽畬鍏ㄤ繚鎸佷笉鍙橈級
  const templateBytes = Uint8Array.from(atob(TEMPLATE_BASE64), c => c.charCodeAt(0));
  const workbook = new ExcelJS.Workbook();
  await workbook.xlsx.load(templateBytes.buffer);
  const ws = workbook.getWorksheet(1);

  // 鎵惧埌宸叉湁鏁版嵁琛屾暟锛屼粠涓嬩竴琛屽紑濮嬪啓鍏?  let rowIdx = 2;
  while (ws.getCell(rowIdx, 1).value) rowIdx++;

  let seq = 1;
  for (const b of boxes) {
    let len = 0, wid = 0, ht = 0;
    if (b.spec) {
      const parts = b.spec.split(/[xX脳\*]/).map(x => parseFloat(x.trim()) || 0);
      if (parts.length >= 1) len = parts[0];
      if (parts.length >= 2) wid = parts[1];
      if (parts.length >= 3) ht = parts[2];
    }
    const bpList = await getBoxProducts(b.id);
    const products = [];
    for (const bp of bpList) {
      const p = await dbGet("products", bp.productId);
      if (p) products.push(p);
    }
    const cnName = products.map(p => p.name).join(", ");
    const enName = products.map(p => p.englishName || p.name).join(", ");
    const material = products.map(p => p.material || "").filter(m => m).join(", ");
    const images = products.map(p => p.image || "").filter(i => i);

    ws.getCell(rowIdx, 3).value = b.boxNumber || "";       // C
    ws.getCell(rowIdx, 15).value = b.boxCount || 1;         // O
    ws.getCell(rowIdx, 16).value = b.boxCount > 1 ? "1-" + b.boxCount : String(seq); // P
    ws.getCell(rowIdx, 17).value = b.weight || 0;            // Q
    ws.getCell(rowIdx, 18).value = len;                      // R
    ws.getCell(rowIdx, 19).value = wid;                      // S
    ws.getCell(rowIdx, 20).value = ht;                       // T
    ws.getCell(rowIdx, 21).value = enName;                   // U
    ws.getCell(rowIdx, 22).value = cnName;                   // V
    ws.getCell(rowIdx, 24).value = b.packingCount || 1;      // X
    ws.getCell(rowIdx, 25).value = material;                 // Y

    // 鍥剧墖
    if (images.length > 0) {
      const imgData = images[0];
      const imgExt = imgData.startsWith("data:image/png") ? "png" : "jpeg";
      try {
        const imageId = workbook.addImage({
          base64: imgData.replace(/^data:image\/\w+;base64,/, ""),
          extension: imgExt,
        });
        ws.addImage(imageId, {
          tl: { col: 29.5, row: rowIdx - 0.5 },
          ext: { width: 80, height: 80 },
        });
      } catch(e) { console.warn("鍥剧墖澶辫触:", e); }
    }
    rowIdx++; seq++;
  }

  try {
    const buffer = await workbook.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "鏆栭槼鏁扮爜-鐗ф磱_" + (shipment.date || "") + ".xlsx";
    link.click();
    URL.revokeObjectURL(link.href);
  } catch(e) {
    alert("瀵煎嚭澶辫触: " + e.message);
  }
}

function switchTab(tabId) {
  document.querySelectorAll('.sub-tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
  var btns = document.querySelectorAll('.sub-tab');
  for (var bi = 0; bi < btns.length; bi++) {
    if (btns[bi].getAttribute('onclick').indexOf(tabId) >= 0) {
      btns[bi].classList.add('active');
    }
  }
  var el = document.getElementById(tabId);
  if (el) el.classList.add('active');
  if (tabId === 'tab-shipments') renderShipments();
  if (tabId === 'tab-stock') renderStockTable();
}
function escHtml(s) { if (!s) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;"); }
document.addEventListener("click", function(e) {
  if (e.target.classList.contains("modal-overlay") && e.target.classList.contains("active")) e.target.classList.remove("active");
});
